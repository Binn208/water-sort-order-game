name: CatSyrupCafe
options:
  bundleIdPrefix: com.catsyrup
  deploymentTarget:
    iOS: "16.0"

schemes:
  CatSyrupCafe:
    build:
      targets:
        CatSyrupCafe: all
    run:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""

targets:
  CatSyrupCafe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/CatSyrupEngine
      - path: Sources/CatSyrupUI
    settings:
      base:
        PRODUCT_NAME: "CatSyrupCafe"
        PRODUCT_BUNDLE_IDENTIFIER: "com.catsyrup.colorsortcafe"
        INFOPLIST_FILE: "Info.plist"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
